apiVersion: v1
kind: Namespace
metadata:
  name: cni-dra-validation
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cni-dra-validation-webhook
  namespace: cni-dra-validation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cni-dra-validation-webhook
rules:
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["admissionregistration.k8s.io"]
  resources: ["validatingwebhookconfigurations"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cni-dra-validation-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cni-dra-validation-webhook
subjects:
- kind: ServiceAccount
  name: cni-dra-validation-webhook
  namespace: cni-dra-validation
---
apiVersion: v1
kind: Secret
metadata:
  name: cni-dra-validation-webhook-certs
  namespace: cni-dra-validation
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cni-dra-validation-webhook
  namespace: cni-dra-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cni-dra-validation-webhook
  template:
    metadata:
      labels:
        app: cni-dra-validation-webhook
    spec:
      serviceAccountName: cni-dra-validation-webhook
      containers:
      - name: webhook
        image: sigs.k8s.io/cni-dra-driver/validation-webhook:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
          name: webhook
        volumeMounts:
        - name: certs
          mountPath: /etc/certs
          readOnly: true
        env:
        - name: DRIVER_NAME
          value: "cni.dra.networking.x-k8s.io"
        - name: WEBHOOK_PORT
          value: "8443"
        - name: CERT_PATH
          value: "/etc/certs/tls.crt"
        - name: KEY_PATH
          value: "/etc/certs/tls.key"
      volumes:
      - name: certs
        secret:
          secretName: cni-dra-validation-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: cni-dra-validation-webhook
  namespace: cni-dra-validation
spec:
  selector:
    app: cni-dra-validation-webhook
  ports:
  - port: 443
    targetPort: 8443
    name: webhook
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionWebhook
metadata:
  name: cni-dra-validation-webhook
webhooks:
- name: cni-dra-validation.networking.x-k8s.io
  clientConfig:
    service:
      name: cni-dra-validation-webhook
      namespace: cni-dra-validation
      path: "/validate"
  rules:
  - operations: ["CREATE", "UPDATE"]
    apiGroups: ["resource.k8s.io"]
    apiVersions: ["v1beta1"]
    resources: ["resourceclaims"]
  failurePolicy: Fail
  sideEffects: None
  admissionReviewVersions: ["v1", "v1beta1"]
